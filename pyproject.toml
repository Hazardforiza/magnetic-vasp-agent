[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "magnetic-vasp-agent"
version = "0.1.0"
description = "Local control plane for magnetic VASP workflows"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.8,<3",
    "typer>=0.12,<1",
    "pymatgen>=2025.6.14,<2026",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]
rag = [
    "qdrant-client>=1.15,<2",
]
semantic = [
    "fastembed>=0.8,<1",
]

[project.scripts]
magvasp = "magnetic_vasp_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
